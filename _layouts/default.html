<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
    {% include header.html %}
    <!-- Primary Page Layout
    –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <style>
        .main .container {
            max-width: 2800px;
        }
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        #gallery .thumb {
            flex: 1 1 calc(25% - 10px);
            margin: 0;
        }
        #gallery .thumb img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .flex-gallery {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            overflow: hidden; 
        }

        .flex-gallery li {
            height: 300px;
            flex-grow: 1;
            margin: 5px;
        }

        .flex-gallery img {
            max-height: 100%;
            min-width: 100%;
            max-width: 100%;
            object-fit: cover;
            vertical-align: bottom;
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 600px) {
        .flex-gallery li {
            height: 200px; /* Shorter rows for small screens */
            margin: 3px;
        }
        
        /* If you want 1 image per row on very small phones */
        @media (max-width: 400px) {
            .flex-gallery li {
            height: auto;
            width: 100%; /* Force full width */
            flex-grow: 0;
            }
            .flex-gallery img {
            width: 100%;
            height: auto;
            }
        }
    }

    </style>

    <div class="section main">
        <iframe allowfullscreen="allowfullscreen" allow="clipboard-write" scrolling="no" class="fp-iframe" style="border: 1px solid lightgray; width: 100%; height: 600px;" src={{ page.heyzine_src }}></iframe>
        <!-- <div class="container">
            {{ page.body | markdownify }}
            <div id="gallery">
                {% assign k = page.name.size | minus: 3 %}
                {% assign n = page.name | slice: 0, k %}

                    </a>
                    {% endfor %}
                {% else %}
                    <p>No images found for collection: {{ n }}</p>
                    <p>Debug info: Collection label: {{ coll.label }}, Collection size: {{ coll.files.size }}</p>
                {% endif %}
            </div>
        </div> -->
        <ul id="photo-gallery" class="flex-gallery">
            <!-- JavaScript will inject <li> items here -->
            <li class="lozad">Loading your photography...</li>
        </ul>
    </div>
    <!-- End Document -->

    {% include footer.html %}

    <!-- <script defer> -->
    <script>
        const folderName = "{{ page.r2_folder }}"; 
        const workerBaseUrl = 'https://image-retriever.gia-arah.workers.dev';

        async function loadAdaptiveGallery() {

            const gallery = $('#photo-gallery');
            
            try {
                const response = await fetch(`${workerBaseUrl}?folder=${folderName}`);
                const images = await response.json();
                
                if (images.length === 0) {
                    gallery.html('<li>No images found in this folder.</li>');
                    return;
                }

                gallery.html(images.map(img => `
                    <li>
                        <a href="${img.url}" data-src="${img.url}">
                            <img src="${img.url}" alt="${img.name}" loading="lazy">
                        </a>
                    </li>
                `).join(''));

                gallery.lightGallery({
                    selector: 'a',
                    download: false,
                });

            } catch (err) {
                console.error(err);
            }
        }

        // loadAdaptiveGallery();
        // document.addEventListener('DOMContentLoaded', loadAdaptiveGallery);
        $(document).ready(function() {
            loadAdaptiveGallery();
        });

    </script>

</body>
</html>
